name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request makes the run for the older one pointless, so
# that run is cancelled. Runs on main are never cancelled: the status line
# reads the result of each commit that reached main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each step that can fail runs through scripts/ci-step.sh, which on failure
# puts the tail of that step's output in an error annotation and the job
# summary, so the check panel says what broke instead of only "exit code 1".
#
# Three jobs run side by side. Until October 2026 one job ran everything in
# series and took twelve minutes, seven of them the test suite held to one
# file at a time for the sake of the few dozen files that use the database.
# The suite is now two vitest projects (vitest.config.ts): `db`, one file at a
# time against Postgres, and `unit`, every other file in parallel with no
# database at all.
jobs:
  # Types, lint, the design checks, the dependency audit and the build. None
  # of them needs a database. Every step after the install runs even when an
  # earlier one failed, so one red run names every check that broke.
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholders: the build validates that these parse, not that they work.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # The type check peaked at about 5 GB until #2205 brought it to about
      # 3 GB, close to Node's default heap. The runner has 16 GB.
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: install
        run: npm ci

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: scripts/ci-step.sh Typecheck npm run typecheck

      # ESLint's rules here each read one file, so a result kept from an
      # earlier run holds until that file or the config changes. With the
      # cache a run lints only what changed: a few seconds rather than two
      # minutes. The content strategy is needed because a fresh checkout gives
      # every file a new modification time.
      - uses: actions/cache@v4
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: scripts/ci-step.sh Lint npm run lint -- --cache --cache-strategy content --cache-location .eslintcache

      # Five themes is five times the surface area for a contrast bug to hide
      # in, and "it looked fine on my screen" is how all of them get shipped.
      - name: Contrast
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: scripts/ci-step.sh Contrast npm run check:contrast

      # The mechanical half of the design laws, against a ratcheting baseline:
      # existing violations are tolerated and counted, new ones are not, and a
      # new file is held to zero from its first line. See scripts/check-ui.ts.
      - name: UI laws
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: scripts/ci-step.sh "UI laws" npm run check:ui

      # The counts the specs' rules hold where they are: one that rises fails.
      # See scripts/check-specs.ts and scripts/spec-counts.ts.
      - name: Spec counts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: scripts/ci-step.sh "Spec counts" npm run check:specs

      # Dependency scanning is a CASA Tier 2 requirement, so it runs from the
      # start rather than being retrofitted before an assessment. Omit dev
      # tooling (eslint, drizzle-kit) — production runtime deps are what ship.
      - name: Audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: scripts/ci-step.sh Audit npm audit --omit=dev --audit-level=high

      # Kept between runs so a build recompiles only what changed.
      - uses: actions/cache@v4
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.css') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # The Typecheck step above has already checked types, so the build skips
      # its own check (next.config.ts) rather than holding a second copy of
      # the program in memory beside the bundle.
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: scripts/ci-step.sh Build npm run build
        env:
          SKIP_BUILD_TYPECHECK: '1'

  # Every test file that does not use the database, in parallel.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: scripts/ci-step.sh Test npm test -- --project unit

  # The RLS, status and coexistence tests need a real Postgres: they assert
  # on policy behaviour, on trigger-maintained columns, and on two apps'
  # schemas sitting side by side -- none of which can be faked. pg_trgm and
  # pgcrypto come with the stock image; pgvector, which learn/0022 needs for
  # catalogue embeddings, does not, so this is the pgvector build of the same
  # Postgres 16.
  db-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5433/shopping_manager_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Applies both migration sets: `public` for the commerce side and
      # `job_search` for the job search side, in that order. The coexistence
      # test asserts against the result, so it exercises the real neighbour
      # rather than a stand-in.
      - name: Apply migrations
        run: scripts/ci-step.sh "Apply migrations" ./scripts/db-reset.sh

      # Includes both cross-user isolation tests, each of which fails
      # automatically if a table is added to its schema without an RLS policy,
      # and the coexistence test that proves neither app's migrations reach
      # into the other's schema.
      - name: Database tests
        run: scripts/ci-step.sh "Database tests" npm test -- --project db

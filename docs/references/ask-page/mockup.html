<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dash Chat Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: app shell top bar, then three columns: conversations | thread | used-in-this-chat. Tokens copied from app/globals.css. */
:root {
  --canvas: #f7f4ed; --surface: #fdfbf5; --raised: #fffdf7; --sunken: #f2f0ea;
  --shell: #e4dfd2; --shell-ink: #1a1a18; --shell-muted: #5d5d58; --shell-hover: #eae7df;
  --border: #e8e5df; --border-strong: #d5d1c8;
  --ink: #1a1a18; --ink-muted: #6b6b66; --ink-ghost: #85857e;
  --accent: #4a5fd0; --accent-hover: #3f52bd; --accent-tint: #eef1fe; --fill-ink: #ffffff;
  --positive: #286f50; --positive-tint: #ecf7f1; --caution: #a34a07; --caution-tint: #fdf3e3;
  --w-shopping: #be1250; --w-jobs: #7c3aed; --w-todo: #036695; --w-vault: #a21caf;
  --w-learn: #0f6b62; --w-news: #806500; --w-goals: #4a6f0c;
  --shadow: 0 6px 20px -6px rgb(0 0 0 / 0.18);
  --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
  --font-display: "Bricolage Grotesque", "Inter", ui-sans-serif, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #08090a; --surface: #0f1011; --raised: #191a1c; --sunken: #050506;
  --shell: #0b0c0d; --shell-ink: #f7f8f8; --shell-muted: #9096a0; --shell-hover: #16171a;
  --border: #212225; --border-strong: #2e3033;
  --ink: #f7f8f8; --ink-muted: #9096a0; --ink-ghost: #6a707a;
  --accent: #8b9dff; --accent-hover: #a3b2ff; --accent-tint: #161a33; --fill-ink: #08090a;
  --positive: #54d6a0; --positive-tint: #0c2119; --caution: #f0a63f; --caution-tint: #251a0b;
  --w-shopping: #ff8fa8; --w-jobs: #b39bff; --w-todo: #4cc2f1; --w-vault: #e690f2;
  --w-learn: #4fd1c5; --w-news: #e8c760; --w-goals: #a3d65a;
  --shadow: 0 8px 28px -8px rgb(0 0 0 / 0.6);
  color-scheme: dark;
}}
:root[data-theme="dark"] {
  --canvas: #08090a; --surface: #0f1011; --raised: #191a1c; --sunken: #050506;
  --shell: #0b0c0d; --shell-ink: #f7f8f8; --shell-muted: #9096a0; --shell-hover: #16171a;
  --border: #212225; --border-strong: #2e3033;
  --ink: #f7f8f8; --ink-muted: #9096a0; --ink-ghost: #6a707a;
  --accent: #8b9dff; --accent-hover: #a3b2ff; --accent-tint: #161a33; --fill-ink: #08090a;
  --positive: #54d6a0; --positive-tint: #0c2119; --caution: #f0a63f; --caution-tint: #251a0b;
  --w-shopping: #ff8fa8; --w-jobs: #b39bff; --w-todo: #4cc2f1; --w-vault: #e690f2;
  --w-learn: #4fd1c5; --w-news: #e8c760; --w-goals: #a3d65a;
  --shadow: 0 8px 28px -8px rgb(0 0 0 / 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.tab { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }

/* Shell top bar, as the app has it */
.topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--shell); color: var(--shell-ink); border-bottom: 1px solid var(--border); }
.switcher { display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 4px; border-radius: 8px; border: 0; background: transparent; font-weight: 600; }
.switcher:hover { background: var(--shell-hover); }
.dash-mark { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(140deg, #8ea0ff, #4a5fd0); display: grid; place-items: center; flex: none; }
.dash-mark svg { width: 13px; height: 13px; }
.crumb { color: var(--shell-muted); font-size: 13px; }
.topbar .spacer { flex: 1; }
.top-search { display: flex; align-items: center; gap: 8px; min-width: 0; width: 240px; padding: 5px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); color: var(--ink-ghost); font-size: 13px; }
.kbd { font: 11px var(--font-mono); padding: 1px 5px; border: 1px solid var(--border-strong); border-radius: 4px; color: var(--ink-muted); background: var(--raised); }
.ws-pop { position: absolute; top: 46px; left: 12px; z-index: 30; width: 250px; background: var(--raised); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; }
.ws-pop .label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-ghost); padding: 8px 8px 4px; }
.ws-item { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; font-size: 13.5px; }
.ws-item:hover { background: var(--sunken); }
.ws-item.on { background: var(--accent-tint); color: var(--accent); font-weight: 600; }
.ws-dot { width: 18px; height: 18px; border-radius: 6px; flex: none; }
.ws-sep { height: 1px; background: var(--border); margin: 6px 4px; }
.ws-note { font-size: 12px; color: var(--ink-muted); padding: 4px 8px 6px; }

/* Three columns */
.main { --list: 272px; --ctx: 300px; display: grid; grid-template-columns: var(--list) minmax(0, 1fr) var(--ctx); min-height: 0; transition: grid-template-columns .2s ease; }
.main.no-ctx { --ctx: 0px; }
.main.no-ctx .ctx { display: none; }
.strip { display: none; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0; }
.list-top { display: flex; align-items: center; justify-content: space-between; }
.list-top .lbl { font: 600 15px var(--font-display); }
@media (min-width: 721px) {
  .main.no-list { --list: 52px; }
  .main.no-list .convs-head, .main.no-list .conv-list { display: none; }
  .main.no-list .strip { display: flex; }
}

/* Left: conversations */
.convs { border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.convs-head { padding: 14px 14px 10px; display: grid; gap: 10px; }
.new-btn { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--raised); font-weight: 500; }
.new-btn:hover { border-color: var(--accent); }
.search { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; background: var(--sunken); border: 1px solid transparent; }
.search:focus-within { border-color: var(--accent); }
.search input { border: 0; background: transparent; outline: none; width: 100%; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border-strong); background: transparent; color: var(--ink-muted); }
.chip .d { width: 7px; height: 7px; border-radius: 50%; }
.chip.on { background: var(--ink); color: var(--canvas); border-color: var(--ink); }
.conv-list { overflow-y: auto; padding: 0 8px 16px; flex: 1; }
.group { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-ghost); padding: 14px 8px 4px; }
.conv { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 8px; border-radius: 8px; border: 0; background: transparent; }
.conv:hover { background: var(--sunken); }
.conv.on { background: var(--accent-tint); }
.conv .t { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.conv.on .t { font-weight: 600; }
.conv .when { font-size: 12px; color: var(--ink-ghost); }
.conv .meta { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-muted); }
.conv .meta .d { width: 6px; height: 6px; border-radius: 50%; }
.conv .live { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; animation: pulse 1.2s infinite; }
.empty-search { padding: 24px 10px; color: var(--ink-muted); font-size: 13px; }

/* Centre: thread */
.thread-col { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--canvas); }
.thread-head { display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-bottom: 1px solid var(--border); }
.thread-head h1 { font: 600 17px/1.3 var(--font-display); margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 5px 8px; color: var(--ink-muted); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.icon-btn:hover { background: var(--sunken); color: var(--ink); }
.icon-btn.on { color: var(--accent); background: var(--accent-tint); }
.back-btn { display: none; }
.scroll { flex: 1; overflow-y: auto; padding: 24px 20px 12px; }
.turns { max-width: 720px; margin: 0 auto; display: grid; gap: 22px; }
.q { justify-self: end; max-width: 85%; background: var(--raised); border: 1px solid var(--border); padding: 9px 13px; border-radius: 14px 14px 4px 14px; }
.q .attach { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-muted); margin-bottom: 4px; }
.a { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; }
.a .body { min-width: 0; display: grid; gap: 10px; }
.a p { margin: 0; max-width: 64ch; }
.lookups { font-size: 12.5px; color: var(--ink-muted); }
.lookups summary { cursor: pointer; list-style: none; display: inline-flex; gap: 6px; align-items: center; }
.lookups summary::-webkit-details-marker { display: none; }
.lookups summary::before { content: "▸"; font-size: 10px; transition: transform .15s; }
.lookups[open] summary::before { transform: rotate(90deg); }
.lookups ul { margin: 6px 0 0; padding: 0 0 0 14px; border-left: 1px solid var(--border-strong); list-style: none; display: grid; gap: 3px; }
.lookups code { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink); }
.working { display: inline-flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-muted); }
.spin { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--accent); animation: rot .8s linear infinite; }
.cites { display: flex; flex-wrap: wrap; gap: 6px; }
.cite { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--sunken); border: 1px solid var(--border); color: var(--ink); text-decoration: none; }
.cite:hover { border-color: var(--border-strong); }
.cite .d { width: 6px; height: 6px; border-radius: 50%; }
.ref { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
.chart { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.chart h3 { margin: 0 0 8px; font-size: 12.5px; font-weight: 600; }
.chart svg { width: 100%; height: auto; display: block; }
.change { border: 1px solid var(--border-strong); background: var(--raised); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.change .h { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-muted); }
.change .what { font-weight: 500; }
.change .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.change.done { border-color: color-mix(in srgb, var(--positive) 40%, var(--border)); background: var(--positive-tint); }
.change.declined { opacity: .65; }
.btn { border-radius: 8px; padding: 5px 12px; font-size: 13px; font-weight: 500; border: 1px solid var(--border-strong); background: var(--raised); }
.btn:hover { border-color: var(--ink-ghost); }
.btn.primary { background: var(--accent); color: var(--fill-ink); border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-muted); }
.actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
.a:hover .actions, .a:focus-within .actions { opacity: 1; }
.actions .icon-btn { font-size: 12px; padding: 3px 7px; }
.cost { font-size: 11.5px; color: var(--ink-ghost); margin-left: auto; align-self: center; }
.handoff { font-size: 12.5px; background: var(--caution-tint); color: var(--caution); border-radius: 8px; padding: 7px 10px; }

/* Composer */
.composer-wrap { padding: 8px 20px 16px; }
.composer { max-width: 720px; margin: 0 auto; background: var(--raised); border: 1px solid var(--border-strong); border-radius: 14px; box-shadow: var(--shadow); position: relative; }
.composer:focus-within { border-color: var(--accent); }
.composer textarea { width: 100%; border: 0; background: transparent; resize: none; outline: none; padding: 12px 14px 4px; min-height: 48px; max-height: 160px; font-size: 14.5px; }
.composer .bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px 8px; flex-wrap: wrap; }
.scope { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); }
.scope .d { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-ghost); }
.hint { font-size: 12px; color: var(--ink-ghost); margin-left: auto; }
.send { width: 32px; height: 32px; border-radius: 9px; border: 0; background: var(--accent); color: var(--fill-ink); display: grid; place-items: center; }
.send:disabled { background: var(--border-strong); cursor: default; }
.send.stop { background: var(--ink); color: var(--canvas); }
.pop { position: absolute; bottom: calc(100% + 6px); left: 8px; z-index: 20; width: min(340px, calc(100% - 16px)); background: var(--raised); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; }
.pop .label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-ghost); padding: 6px 8px 4px; }
.pop button { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: 8px; font-size: 13px; }
.pop button:hover, .pop button.sel { background: var(--sunken); }
.pop .sub { color: var(--ink-muted); font-size: 12px; margin-left: auto; }
.pop code { font-family: var(--font-mono); font-size: 12px; }
.mention { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--accent-tint); color: var(--accent); }
.mention button { border: 0; background: transparent; color: inherit; padding: 0; }
.attached { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 12px 0; }

/* Right: used in this chat */
.ctx { border-left: 1px solid var(--border); background: var(--surface); overflow-y: auto; padding: 16px; display: grid; align-content: start; gap: 20px; min-width: 0; }
.ctx h2 { font: 600 14px var(--font-display); margin: 0; display: flex; align-items: center; gap: 8px; }
.ctx h2 .close-ctx { margin-left: auto; display: none; }
.sec h3 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-ghost); margin: 0 0 6px; font-weight: 600; display: flex; justify-content: space-between; }
.sec ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.sec li a, .sec li .item { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 5px 6px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 13px; }
.sec li a:hover { background: var(--sunken); }
.sec li .d { width: 7px; height: 7px; border-radius: 50%; align-self: center; }
.sec li .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sec li .x { font-size: 12px; color: var(--ink-muted); }
.sec .none { font-size: 12.5px; color: var(--ink-ghost); padding: 2px 6px; }
.undo { border: 0; background: transparent; color: var(--accent); font-size: 12px; padding: 0; }
.costline { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 6px; }
.costline + .costline { color: var(--ink-muted); }
.example { font-size: 11.5px; color: var(--ink-ghost); border-top: 1px solid var(--border); padding-top: 12px; }

.scrim { display: none; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--canvas); padding: 8px 14px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); z-index: 50; }

@keyframes rot { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .3; } }
.caret::after { content: ""; display: inline-block; width: 7px; height: 14px; background: var(--accent); vertical-align: -2px; margin-left: 2px; animation: pulse .9s infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Laptop without room for the third column: it becomes a sheet from the right */
@media (max-width: 1100px) {
  .main, .main.no-ctx { grid-template-columns: var(--list) minmax(0, 1fr); }
  .main { --list: 252px; }
  .ctx { position: fixed; right: 0; top: 0; bottom: 0; width: min(340px, 92vw); z-index: 40; box-shadow: var(--shadow); padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
  .main.no-ctx .ctx { display: none; }
  .ctx h2 .close-ctx { display: inline-flex; }
  .main:not(.no-ctx) .scrim { display: block; position: fixed; inset: 0; background: rgb(0 0 0 / .25); z-index: 35; }
}
/* Phone: the list is the page, a chat opens over it */
@media (max-width: 720px) {
  .top-search, .crumb, .hide-list { display: none; }
  .main, .main.no-ctx { grid-template-columns: minmax(0, 1fr); }
  .convs { border-right: 0; }
  .thread-col { display: none; }
  .main.reading .convs { display: none; }
  .main.reading .thread-col { display: flex; }
  .back-btn { display: inline-flex; }
  .thread-head, .scroll, .composer-wrap { padding-left: 16px; padding-right: 16px; }
  .ctx { left: 0; right: 0; top: auto; width: auto; max-height: 75vh; border-radius: 16px 16px 0 0; border-left: 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .q { max-width: 92%; }
  .a { grid-template-columns: minmax(0, 1fr); }
  .a > .dash-mark { display: none; }
  .actions { opacity: 1; }
  .hint { display: none; }
}
</style>

<div class="app">
  <header class="topbar">
    <button class="switcher" id="switcher" aria-haspopup="true" aria-expanded="false">
      <span class="dash-mark" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5c1.6-3.4 8.4-3.4 10 0M5.5 11h5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></span>
      Dash <span style="color:var(--shell-muted)">▾</span>
    </button>
    <span class="crumb">Chats</span>
    <span class="spacer"></span>
    <div class="top-search">Search everything <span class="kbd" style="margin-left:auto">⌘K</span></div>
  </header>

  <div class="main" id="main">
    <aside class="convs" aria-label="Conversations">
      <div class="strip">
        <button class="icon-btn" id="showList" title="Show chats (⌘\)" aria-label="Show chats">☰</button>
        <button class="icon-btn" id="stripNew" title="New chat (⌘N)" aria-label="New chat">＋</button>
      </div>
      <div class="convs-head">
        <div class="list-top"><span class="lbl">Chats</span><button class="icon-btn hide-list" id="hideList" title="Hide chats (⌘\)" aria-label="Hide chats">⇤</button></div>
        <button class="new-btn" id="newChat"><span>＋ New chat</span><span class="kbd">⌘N</span></button>
        <label class="search"><span aria-hidden="true" style="color:var(--ink-ghost)">⌕</span><input id="convSearch" placeholder="Search every message" aria-label="Search conversations"></label>
        <div class="chips" id="chips"></div>
      </div>
      <div class="conv-list" id="convList"></div>
    </aside>

    <section class="thread-col" aria-label="Conversation">
      <div class="thread-head">
        <button class="icon-btn back-btn" id="backBtn" aria-label="Back to chats">← Chats</button>
        <h1 id="threadTitle"></h1>
        <button class="icon-btn" id="pinBtn" title="Pin">☆ Pin</button>
        <button class="icon-btn on" id="ctxBtn" title="What Dash used in this chat">◫ Used</button>
      </div>
      <div class="scroll" id="scroll"><div class="turns" id="turns"></div></div>
      <div class="composer-wrap">
        <form class="composer" id="composer">
          <div class="attached" id="attached" hidden></div>
          <textarea id="input" rows="1" placeholder="Ask Dash anything in your dashboard. @ to add a row, / for a command" aria-label="Message Dash"></textarea>
          <div class="bar">
            <button type="button" class="icon-btn" title="Attach a file" aria-label="Attach a file">📎</button>
            <button type="button" class="scope" id="scopeBtn" aria-haspopup="true"><span class="d" id="scopeDot"></span><span id="scopeLabel">Everything</span> ▾</button>
            <span class="hint">⏎ send · ⇧⏎ new line</span>
            <button type="submit" class="send" id="send" aria-label="Send" disabled>↑</button>
          </div>
          <div class="pop" id="pop" hidden></div>
        </form>
      </div>
    </section>

    <aside class="ctx" id="ctx" aria-label="Used in this chat"></aside>
    <div class="scrim" id="scrim"></div>
  </div>
</div>

<script>
const W = {
  shopping: { name: 'Shopping', c: 'var(--w-shopping)' }, jobs: { name: 'Jobs', c: 'var(--w-jobs)' },
  todo: { name: 'Todo', c: 'var(--w-todo)' }, vault: { name: 'Vault', c: 'var(--w-vault)' },
  learn: { name: 'Learn', c: 'var(--w-learn)' }, news: { name: 'News', c: 'var(--w-news)' },
  goals: { name: 'Goals', c: 'var(--w-goals)' },
};
const MARK = '<span class="dash-mark" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5c1.6-3.4 8.4-3.4 10 0M5.5 11h5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></span>';

const chartSvg = `<svg viewBox="0 0 420 150" role="img" aria-label="Food spend by week in September">
  <g stroke="var(--border)" stroke-width="1"><line x1="40" y1="20" x2="410" y2="20"/><line x1="40" y1="65" x2="410" y2="65"/><line x1="40" y1="110" x2="410" y2="110"/></g>
  <g fill="var(--ink-ghost)" font-size="10" text-anchor="end" font-family="Inter, sans-serif"><text x="34" y="24">$200</text><text x="34" y="69">$100</text><text x="34" y="114">$0</text></g>
  <g fill="var(--w-shopping)"><rect x="62" y="57" width="52" height="53" rx="3"/><rect x="152" y="38" width="52" height="72" rx="3"/><rect x="242" y="29" width="52" height="81" rx="3"/><rect x="332" y="23" width="52" height="87" rx="3"/></g>
  <g fill="var(--ink)" font-size="10.5" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600"><text x="88" y="51">$118</text><text x="178" y="32">$161</text><text x="268" y="23">$181</text><text x="358" y="17">$193</text></g>
  <g fill="var(--ink-muted)" font-size="10.5" text-anchor="middle" font-family="Inter, sans-serif"><text x="88" y="128">1–7 Sep</text><text x="178" y="128">8–14</text><text x="268" y="128">15–21</text><text x="358" y="128">22–30</text></g>
</svg>`;

let convs = [
  { id: 'food', title: 'Food spend in September', when: '9:41', group: 'Today', ws: ['shopping', 'todo'], pinned: false, cost: 4,
    turns: [
      { q: 'How much did I spend on food in September, and is it going up?' },
      { a: true, lookups: ['spend_by_merchant · category food · September', 'list_rows · orders · 31 rows'],
        text: 'You spent <b class="tab">$653</b> on food in September, up from <span class="tab">$512</span> in August. It climbed every week. Most of the rise is delivery: <a class="ref" href="#">DoorDash</a> went from 4 orders to 11.',
        chart: true,
        cites: [['shopping', 'DoorDash · 11 orders'], ['shopping', "Trader Joe's · 6 orders"], ['shopping', 'HelloFresh · 4 boxes']],
        change: { kind: 'Add a todo', what: 'Pause HelloFresh before the 18 Oct box ships', ws: 'todo', state: 'proposed' }, cost: '2¢' },
      { q: 'What did the HelloFresh boxes cost each?' },
      { a: true, lookups: ['list_rows · orders · merchant HelloFresh'],
        text: 'Each box was <b class="tab">$71.94</b>, and the four came to <span class="tab">$287.76</span>. That is 44% of September’s food spend for about 12 dinners, so roughly <span class="tab">$6</span> a plate more than cooking from Trader Joe’s.',
        cites: [['shopping', 'HelloFresh · 2 Sep'], ['shopping', 'HelloFresh · 9 Sep'], ['shopping', 'HelloFresh · 16 Sep'], ['shopping', 'HelloFresh · 23 Sep']], cost: '1¢' },
    ] },
  { id: 'jobs', title: 'Which applications have gone quiet', when: '8:12', group: 'Today', ws: ['jobs'], pinned: true, cost: 3,
    turns: [
      { q: 'Which of my applications have had no reply in two weeks?' },
      { a: true, lookups: ['job_applications · status submitted · no reply 14 days'],
        text: 'Three have been quiet for more than two weeks: <a class="ref" href="#">Linear, Product Engineer</a> (19 days), <a class="ref" href="#">Vercel, DX Engineer</a> (16 days) and <a class="ref" href="#">Ramp, Frontend</a> (15 days). Linear’s recruiter wrote once on 24 Sep, so a nudge there has a person to go to.',
        cites: [['jobs', 'Linear · Product Engineer'], ['jobs', 'Vercel · DX Engineer'], ['jobs', 'Ramp · Frontend']],
        change: { kind: 'Add 3 todos', what: 'Follow up on Linear, Vercel and Ramp by Friday', ws: 'todo', state: 'done' }, cost: '3¢' },
    ] },
  { id: 'learn', title: 'What to read next on databases', when: 'Yesterday', group: 'Yesterday', ws: ['learn'], pinned: false, cost: 2,
    turns: [
      { q: 'I finished the Postgres indexing chapter. What should I read next?' },
      { a: true, lookups: ['learning_covered · topic databases', 'reading_list · unread'],
        text: 'You have covered B-tree indexes and EXPLAIN. The next unread item that builds on them is <a class="ref" href="#">Use The Index, Luke: chapter 3, “Performance and scalability”</a>, already on your reading list. After that, the MVCC essay you saved on 2 Oct.',
        cites: [['learn', 'Use The Index, Luke · ch. 3'], ['learn', 'MVCC in Postgres']], cost: '2¢' },
    ] },
  { id: 'goals', title: 'Half-marathon goal, this week', when: 'Mon', group: 'This week', ws: ['goals', 'todo'], pinned: false, cost: 2,
    turns: [
      { q: 'Am I on track for the half marathon?' },
      { a: true, lookups: ['goal_status · Run a half marathon'],
        text: 'Mostly. You have done 9 of the 12 long runs the plan has up to now. The step <a class="ref" href="#">Book the race</a> is still open and registration closes on 20 Oct.',
        cites: [['goals', 'Run a half marathon'], ['goals', 'Book the race']],
        handoff: 'Dash could not book the race itself, so it handed this on. The backup routine will reply here.', cost: '2¢' },
    ] },
  { id: 'vault', title: 'Notes I wrote about burnout', when: '2 Oct', group: 'Earlier', ws: ['vault'], pinned: false, cost: 1,
    turns: [
      { q: 'What have I written about burnout?' },
      { a: true, lookups: ['vault_notes · search burnout'],
        text: 'Four notes mention it. The longest is <a class="ref" href="#">“Running on empty”</a> from March, which lists the three weeks you worked past 9pm. The most recent is a two-line note from 28 Sep.',
        cites: [['vault', 'Running on empty'], ['vault', '28 Sep · short note']], cost: '1¢' },
    ] },
];

const state = { active: 'food', filter: null, query: '', scope: null, mentions: [], running: false, timer: null, ctx: true, popMode: null };
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const strip = (h) => h.replace(/<[^>]+>/g, '');

function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }

function renderChips() {
  const used = [...new Set(convs.flatMap((c) => c.ws))];
  $('chips').innerHTML = used.map((k) => `<button class="chip ${state.filter === k ? 'on' : ''}" data-ws="${k}"><span class="d" style="background:${W[k].c}"></span>${W[k].name}</button>`).join('');
}

function matches(c) {
  if (state.filter && !c.ws.includes(state.filter)) return false;
  if (!state.query) return true;
  const q = state.query.toLowerCase();
  return c.title.toLowerCase().includes(q) || c.turns.some((t) => strip(t.q || t.text || '').toLowerCase().includes(q));
}

function renderList() {
  const list = convs.filter(matches);
  const groups = [['Pinned', list.filter((c) => c.pinned)]];
  for (const g of ['Today', 'Yesterday', 'This week', 'Earlier']) groups.push([g, list.filter((c) => !c.pinned && c.group === g)]);
  let html = '';
  for (const [g, items] of groups) {
    if (!items.length) continue;
    html += `<div class="group">${g}</div>`;
    for (const c of items) {
      const live = state.running && c.id === state.active;
      html += `<button class="conv ${c.id === state.active ? 'on' : ''}" data-id="${c.id}">
        <span class="t">${esc(c.title)}</span><span class="when tab">${live ? '<span class="live" title="Dash is answering"></span>' : c.when}</span>
        <span class="meta">${c.ws.map((k) => `<span class="d" style="background:${W[k].c}"></span>${W[k].name}`).join(' · ')}</span>
      </button>`;
    }
  }
  $('convList').innerHTML = html || `<div class="empty-search">No chat mentions “${esc(state.query)}”. Search looks through every message, yours and Dash’s.</div>`;
}

function turnHtml(t, i) {
  if (t.q) {
    const at = t.mentions?.length ? `<div class="attach">${t.mentions.map((m) => `<span class="mention">@ ${esc(m)}</span>`).join('')}</div>` : '';
    return `<div class="q">${at}${esc(t.q)}</div>`;
  }
  const lk = t.lookups?.length ? (t.pending
      ? `<div class="working"><span class="spin"></span>${esc(t.lookups[t.lookups.length - 1])}</div>`
      : `<details class="lookups"><summary>Looked at ${t.lookups.length} ${t.lookups.length === 1 ? 'thing' : 'things'}</summary><ul>${t.lookups.map((l) => `<li><code>${esc(l)}</code></li>`).join('')}</ul></details>`) : '';
  const body = t.text != null ? `<p class="${t.streaming ? 'caret' : ''}">${t.text}</p>` : '';
  const chart = t.chart && !t.streaming ? `<div class="chart"><h3>Food spend by week, September</h3>${chartSvg}</div>` : '';
  const cites = t.cites && !t.streaming ? `<div class="cites">${t.cites.map(([k, n]) => `<a class="cite" href="#"><span class="d" style="background:${W[k].c}"></span>${esc(n)}</a>`).join('')}</div>` : '';
  let change = '';
  if (t.change && !t.streaming) {
    const ch = t.change;
    const ctl = ch.state === 'proposed'
      ? `<div class="row"><button class="btn primary" data-act="confirm" data-i="${i}">Do it</button><button class="btn" data-act="decline" data-i="${i}">No thanks</button></div>`
      : ch.state === 'done'
        ? `<div class="row" style="font-size:12.5px;color:var(--positive)">Done · <button class="undo" data-act="undo" data-i="${i}">Undo</button></div>`
        : `<div class="row" style="font-size:12.5px;color:var(--ink-muted)">Left as it was</div>`;
    change = `<div class="change ${ch.state}"><div class="h"><span class="d" style="width:7px;height:7px;border-radius:50%;background:${W[ch.ws].c}"></span>${esc(ch.kind)}</div><div class="what">${esc(ch.what)}</div>${ctl}</div>`;
  }
  const handoff = t.handoff && !t.streaming ? `<div class="handoff">${esc(t.handoff)}</div>` : '';
  const acts = !t.pending && !t.streaming ? `<div class="actions">
      <button class="icon-btn" data-act="copy" data-i="${i}">Copy</button>
      <button class="icon-btn" data-act="retry" data-i="${i}">Retry</button>
      <button class="icon-btn" data-act="todo" data-i="${i}">To a todo</button>
      <button class="icon-btn" data-act="vault" data-i="${i}">Save to vault</button>
      <span class="cost tab">${t.cost || ''}</span></div>` : '';
  return `<div class="a">${MARK}<div class="body">${lk}${body}${chart}${cites}${change}${handoff}${acts}</div></div>`;
}

function active() { return convs.find((c) => c.id === state.active); }

function renderThread() {
  const c = active();
  $('threadTitle').textContent = c ? c.title : 'New chat';
  $('pinBtn').textContent = c?.pinned ? '★ Pinned' : '☆ Pin';
  $('pinBtn').classList.toggle('on', !!c?.pinned);
  if (!c || !c.turns.length) {
    $('turns').innerHTML = `<div class="a">${MARK}<div class="body"><p>Ask about anything in your dashboard. I read your orders, applications, todos, goals, notes and reading list, link every row I use, and ask before I change anything.</p>
      <div class="cites">${['What did I spend on Amazon this month?', 'Which todos are overdue?', 'Summarise my week in Learn'].map((s) => `<button class="cite" data-suggest="${esc(s)}">${esc(s)}</button>`).join('')}</div></div></div>`;
  } else {
    $('turns').innerHTML = c.turns.map(turnHtml).join('');
  }
  $('scroll').scrollTop = $('scroll').scrollHeight;
}

function renderCtx() {
  const c = active();
  const a = c ? c.turns.filter((t) => t.a && !t.pending) : [];
  const rows = a.flatMap((t) => t.cites || []);
  const changes = a.map((t, i) => t.change).filter(Boolean);
  const looks = a.flatMap((t) => t.lookups || []);
  $('ctx').innerHTML = `
    <h2>Used in this chat <button class="icon-btn close-ctx" id="closeCtx" aria-label="Close">✕</button></h2>
    <div class="sec"><h3><span>Rows Dash read</span><span class="tab">${rows.length}</span></h3>
      ${rows.length ? `<ul>${rows.map(([k, n]) => `<li><a href="#"><span class="d" style="background:${W[k].c}"></span><span class="n">${esc(n)}</span><span class="x">${W[k].name}</span></a></li>`).join('')}</ul>` : '<div class="none">Nothing yet.</div>'}</div>
    <div class="sec"><h3><span>Changes</span><span class="tab">${changes.length}</span></h3>
      ${changes.length ? `<ul>${changes.map((ch) => `<li><span class="item"><span class="d" style="background:${W[ch.ws].c}"></span><span class="n">${esc(ch.what)}</span><span class="x">${ch.state === 'done' ? 'Done' : ch.state === 'proposed' ? 'Waiting on you' : 'Declined'}</span></span></li>`).join('')}</ul>` : '<div class="none">Dash has not changed anything here.</div>'}</div>
    <div class="sec"><h3><span>Lookups</span><span class="tab">${looks.length}</span></h3>
      ${looks.length ? `<ul>${looks.map((l) => `<li><span class="item" style="grid-template-columns:1fr"><code style="font:11.5px var(--font-mono);color:var(--ink-muted)">${esc(l)}</code></span></li>`).join('')}</ul>` : '<div class="none">None yet.</div>'}</div>
    <div class="sec"><h3><span>Files</span><span class="tab">0</span></h3><div class="none">Attach a receipt, a PDF or a screenshot with 📎.</div></div>
    <div class="sec"><h3><span>Cost</span></h3>
      <div class="costline"><span>This chat</span><span class="tab">${c ? c.cost : 0}¢</span></div>
      <div class="costline"><span>Dash this month</span><span class="tab">$1.84</span></div></div>
    <div class="example">Mockup with example data. Every row, number and name here is made up.</div>`;
}

function renderAll() { renderChips(); renderList(); renderThread(); renderCtx(); }

/* Composer */
const input = $('input');
function syncSend() {
  const btn = $('send');
  if (state.running) { btn.disabled = false; btn.classList.add('stop'); btn.textContent = '■'; btn.setAttribute('aria-label', 'Stop'); return; }
  btn.classList.remove('stop'); btn.textContent = '↑'; btn.setAttribute('aria-label', 'Send');
  btn.disabled = !input.value.trim();
}
function grow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px'; }

const ROWS = [['shopping', 'DoorDash', 'Merchant · 11 orders'], ['jobs', 'Linear · Product Engineer', 'Application'], ['goals', 'Run a half marathon', 'Goal'], ['learn', 'Use The Index, Luke', 'Reading list'], ['vault', 'Running on empty', 'Note'], ['todo', 'Renew passport', 'Todo · due 30 Oct']];
const CMDS = [['/todo', 'Add a todo from what you type'], ['/read', 'Save a link to your reading list'], ['/log', 'Record what this chat covered in Learn'], ['/chart', 'Answer with a chart']];
const SCOPES = [[null, 'Everything'], ...Object.entries(W).map(([k, v]) => [k, v.name])];

function openPop(mode, filter = '') {
  state.popMode = mode;
  const pop = $('pop');
  let html = '';
  if (mode === 'mention') {
    const f = filter.toLowerCase();
    const r = ROWS.filter(([, n]) => n.toLowerCase().includes(f));
    html = `<div class="label">Add a row for Dash to read</div>` + (r.length ? r.map(([k, n, s]) => `<button type="button" data-mention="${esc(n)}"><span class="ws-dot" style="width:8px;height:8px;border-radius:50%;background:${W[k].c}"></span>${esc(n)}<span class="sub">${esc(s)}</span></button>`).join('') : `<div class="none" style="padding:6px 8px;color:var(--ink-ghost);font-size:12.5px">No row called “${esc(filter)}”.</div>`);
  } else if (mode === 'cmd') {
    const r = CMDS.filter(([c]) => c.startsWith('/' + filter));
    html = `<div class="label">Commands</div>` + r.map(([c, s]) => `<button type="button" data-cmd="${c}"><code>${c}</code><span class="sub">${s}</span></button>`).join('');
  } else if (mode === 'scope') {
    html = `<div class="label">Dash looks in</div>` + SCOPES.map(([k, n]) => `<button type="button" data-scope="${k ?? ''}" class="${state.scope === k ? 'sel' : ''}"><span class="ws-dot" style="width:8px;height:8px;border-radius:50%;background:${k ? W[k].c : 'var(--ink-ghost)'}"></span>${n}${k ? '' : '<span class="sub">every workspace</span>'}</button>`).join('');
  }
  pop.innerHTML = html; pop.hidden = false;
}
function closePop() { $('pop').hidden = true; state.popMode = null; }

function renderMentions() {
  const el = $('attached');
  el.hidden = !state.mentions.length;
  el.innerHTML = state.mentions.map((m, i) => `<span class="mention">@ ${esc(m)} <button type="button" data-unmention="${i}" aria-label="Remove">✕</button></span>`).join('');
}

input.addEventListener('input', () => {
  grow(); syncSend();
  const v = input.value, caret = input.selectionStart;
  const before = v.slice(0, caret);
  const at = before.match(/@([\w' ]{0,24})$/);
  if (at) return openPop('mention', at[1]);
  const sl = v.match(/^\/(\w*)$/);
  if (sl) return openPop('cmd', sl[1]);
  if (state.popMode === 'mention' || state.popMode === 'cmd') closePop();
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('composer').requestSubmit(); }
  if (e.key === 'Escape') { if (state.running) stop(); closePop(); }
});
$('pop').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.mention) {
    state.mentions.push(b.dataset.mention);
    input.value = input.value.replace(/@([\w' ]{0,24})$/, '');
    renderMentions();
  } else if (b.dataset.cmd) {
    input.value = b.dataset.cmd + ' ';
  } else if ('scope' in b.dataset) {
    state.scope = b.dataset.scope || null;
    $('scopeLabel').textContent = state.scope ? W[state.scope].name + ' only' : 'Everything';
    $('scopeDot').style.background = state.scope ? W[state.scope].c : 'var(--ink-ghost)';
  }
  closePop(); input.focus(); syncSend();
});
$('attached').addEventListener('click', (e) => { const b = e.target.closest('[data-unmention]'); if (b) { state.mentions.splice(+b.dataset.unmention, 1); renderMentions(); } });
$('scopeBtn').addEventListener('click', (e) => { e.stopPropagation(); state.popMode === 'scope' ? closePop() : openPop('scope'); });

/* Sending: lookups first, then the answer streams in */
function reply(q) {
  const scope = state.scope ? W[state.scope].name : null;
  if (/^\/todo/.test(q)) return { lookups: ['todos · check for duplicates'], text: 'Here is the todo. It goes in when you say so.', change: { kind: 'Add a todo', what: q.replace(/^\/todo\s*/, '') || 'New todo', ws: 'todo', state: 'proposed' }, cites: [], cost: '1¢' };
  return {
    lookups: [`search · “${q.slice(0, 32)}${q.length > 32 ? '…' : ''}”${scope ? ' · ' + scope + ' only' : ''}`, 'open_row · 2 rows'],
    text: `This is a mocked answer, so nothing was really looked up. In the real page the text streams in word by word as Dash writes it, the lookups fold into the line above once they finish, and every row Dash used shows as a link under the answer and in the column on the right.`,
    cites: [[state.scope || 'todo', state.mentions[0] || 'Renew passport'], [state.scope || 'goals', 'Run a half marathon']], cost: '2¢',
  };
}
function send(q) {
  let c = active();
  if (!c) {
    c = { id: 'n' + Date.now(), title: q.length > 48 ? q.slice(0, 46) + '…' : q, when: 'Now', group: 'Today', ws: [], pinned: false, cost: 0, turns: [] };
    convs.unshift(c); state.active = c.id;
  }
  c.turns.push({ q, mentions: [...state.mentions] });
  const r = reply(q);
  const t = { a: true, pending: true, lookups: [r.lookups[0]], text: null };
  c.turns.push(t);
  state.mentions = []; renderMentions();
  input.value = ''; grow();
  state.running = true; syncSend(); renderAll();
  let step = 0;
  const words = r.text.split(' ');
  state.timer = setInterval(() => {
    step++;
    if (step === 3 && r.lookups[1]) { t.lookups.push(r.lookups[1]); renderThread(); return; }
    if (step === 6) { t.pending = false; t.streaming = true; t.text = ''; renderThread(); return; }
    if (step > 6) {
      const n = step - 6;
      t.text = words.slice(0, n).join(' ');
      if (n >= words.length) {
        Object.assign(t, { streaming: false, cites: r.cites, change: r.change, cost: r.cost });
        for (const [k] of r.cites || []) if (!c.ws.includes(k)) c.ws.push(k);
        if (r.change && !c.ws.includes(r.change.ws)) c.ws.push(r.change.ws);
        c.cost += parseInt(r.cost);
        finish(); return;
      }
      const p = document.querySelector('#turns .a:last-child p');
      if (p) p.innerHTML = t.text; $('scroll').scrollTop = $('scroll').scrollHeight;
    }
  }, 70);
}
function finish() { clearInterval(state.timer); state.running = false; syncSend(); renderAll(); }
function stop() {
  const t = active()?.turns.at(-1);
  if (t && t.a) { t.pending = false; t.streaming = false; t.text = (t.text || '') + (t.text ? ' ' : '') + '<em style="color:var(--ink-ghost)">Stopped. What Dash had written so far is kept.</em>'; }
  finish();
}
$('composer').addEventListener('submit', (e) => {
  e.preventDefault();
  if (state.running) return stop();
  const q = input.value.trim(); if (!q) return;
  closePop(); send(q);
});

/* Thread actions */
$('turns').addEventListener('click', (e) => {
  const s = e.target.closest('[data-suggest]');
  if (s) { input.value = s.dataset.suggest; syncSend(); $('composer').requestSubmit(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const t = active().turns[+b.dataset.i];
  const act = b.dataset.act;
  if (act === 'confirm') { t.change.state = 'done'; toast('Todo added'); }
  else if (act === 'decline') t.change.state = 'declined';
  else if (act === 'undo') { t.change.state = 'proposed'; toast('Undone'); }
  else if (act === 'copy') { navigator.clipboard?.writeText(strip(t.text)).then(() => toast('Copied'), () => toast('Select the text to copy it')); return; }
  else if (act === 'retry') { toast('Dash would answer this again'); return; }
  else if (act === 'todo') { toast('Todo added from this answer'); return; }
  else if (act === 'vault') { toast('Saved to the vault as a note'); return; }
  renderThread(); renderCtx();
});
$('turns').addEventListener('click', (e) => { if (e.target.closest('a')) e.preventDefault(); });

/* Sidebar */
$('convList').addEventListener('click', (e) => {
  const b = e.target.closest('.conv'); if (!b) return;
  if (state.running) finish();
  state.active = b.dataset.id; $('main').classList.add('reading'); renderAll();
});
$('chips').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (!b) return; state.filter = state.filter === b.dataset.ws ? null : b.dataset.ws; renderChips(); renderList(); });
$('convSearch').addEventListener('input', (e) => { state.query = e.target.value.trim(); renderList(); });
$('newChat').addEventListener('click', () => { if (state.running) finish(); state.active = null; $('main').classList.add('reading'); renderAll(); input.focus(); });
$('backBtn').addEventListener('click', () => $('main').classList.remove('reading'));
$('pinBtn').addEventListener('click', () => { const c = active(); if (!c) return; c.pinned = !c.pinned; renderAll(); });

/* Context column */
function setCtx(on) { state.ctx = on; $('main').classList.toggle('no-ctx', !on); $('ctxBtn').classList.toggle('on', on); }
$('ctxBtn').addEventListener('click', () => setCtx(!state.ctx));
$('scrim').addEventListener('click', () => setCtx(false));
$('ctx').addEventListener('click', (e) => { if (e.target.closest('#closeCtx')) setCtx(false); if (e.target.closest('a')) e.preventDefault(); });
if (matchMedia('(max-width: 1100px)').matches) setCtx(false);

/* Workspace switcher: Dash sits above the workspaces */
$('switcher').addEventListener('click', (e) => {
  e.stopPropagation();
  let p = document.querySelector('.ws-pop');
  if (p) { p.remove(); $('switcher').setAttribute('aria-expanded', 'false'); return; }
  p = document.createElement('div'); p.className = 'ws-pop';
  p.innerHTML = `<div class="ws-item">⌂ Home</div><div class="ws-item on">${MARK} Dash <span class="kbd" style="margin-left:auto">G D</span></div>
    <div class="ws-sep"></div><div class="label">Workspaces</div>
    ${Object.values(W).map((w) => `<div class="ws-item"><span class="ws-dot" style="background:${w.c}"></span>${w.name}</div>`).join('')}
    <div class="ws-sep"></div><div class="ws-note">Dash reads across every workspace, so it sits with Home rather than among them.</div>`;
  document.body.appendChild(p); $('switcher').setAttribute('aria-expanded', 'true');
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.ws-pop')) document.querySelector('.ws-pop')?.remove();
  if (!e.target.closest('.composer')) closePop();
});
/* The list of chats hides to a strip, and the choice is kept on this device */
function setList(open) {
  $('main').classList.toggle('no-list', !open);
  try { localStorage.setItem('dash-list-open', open ? '1' : '0'); } catch {}
}
$('hideList').addEventListener('click', () => setList(false));
$('showList').addEventListener('click', () => setList(true));
$('stripNew').addEventListener('click', () => $('newChat').click());
try { if (localStorage.getItem('dash-list-open') === '0') setList(false); } catch {}

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n') { e.preventDefault(); $('newChat').click(); }
  if ((e.metaKey || e.ctrlKey) && e.key === '\\') { e.preventDefault(); setList($('main').classList.contains('no-list')); }
});

renderAll(); syncSend();
</script>

</body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faint text on a panel</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #f4f1ea; }
  main { padding: 24px 16px 120px; }
  .panel { background: #ffffff; border-radius: 12px; padding: 16px; }
  button, a.button { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; padding: 0 16px; font: inherit; }
</style>
</head>
<body>
<main>
  <div class="panel">
    <p style="color:#a8a8a8">Grey text on white, about 2.4 to 1.</p>
  </div>
</main>
</body>
</html>

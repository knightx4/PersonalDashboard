<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A pane that scrolls inside itself</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #f4f1ea; }
  .pane { position: fixed; left: 16px; right: 16px; top: 76px; bottom: 86px; display: flex; flex-direction: column; background: #ffffff; border-radius: 12px; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }
  .foot { flex-shrink: 0; padding: 12px 16px; }
  /* Puts Remove at about 790px: in the dock's band, but past the scroller's foot at 690. */
  .tall { height: 640px; }
  button { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; padding: 0 16px; font: inherit; }
</style>
</head>
<body>
<div class="pane">
  <div class="scroll">
    <p>A form held between the top bar and the dock, whose fields scroll inside it.</p>
    <div class="tall"></div>
    <button>Remove</button>
  </div>
  <div class="foot"><button>Save</button></div>
</div>
</body>
</html>
